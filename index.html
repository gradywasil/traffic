<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090b10" />
    <meta
      name="description"
      content="A deterministic, 60fps traffic intersection simulator — tune signal timing and watch measured control delay respond, then let a paired-seed sweep grade your plan. Hand-built with zero runtime dependencies; runs entirely in your browser."
    />
    <title>Traffic Intersection Flow Simulator</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='3.5' y='1' width='9' height='14' rx='2' fill='%23171b22' stroke='%235d687e'/%3E%3Ccircle cx='8' cy='4.4' r='1.7' fill='%23ff5d5d'/%3E%3Ccircle cx='8' cy='8' r='1.7' fill='%23ffcf3f'/%3E%3Ccircle cx='8' cy='11.6' r='1.7' fill='%233fd158'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: dark;
        --panel-bg: #10141c;
        --panel-border: #232a36;
        --text: #d7dde8;
        --text-dim: #8b95a6;
        --accent: #6fb7ff;
        --error: #ff7a7a;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #090b10;
      }
      body {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: var(--text);
      }
      /* Screen-reader-only text (D1 a11y: page h1 + section h2 without
         visual weight). */
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        border: 0;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        overflow: hidden;
        white-space: nowrap;
      }
      /* Stage: canvas world + control panel side by side at >= 1280x720; the
         panel wraps below on narrow windows (not a target viewport). */
      .stage {
        display: flex;
        flex-wrap: wrap;
        align-items: stretch;
        min-height: 100vh;
      }
      .world-column {
        flex: 1 1 640px;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .canvas-wrap {
        position: relative;
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 6px;
        min-height: 320px;
      }
      #world {
        display: block;
        background: #0b0e14;
        /* 1280x720 logical frame, scaled to the laid-out box (painter sizes
           the backing store to match; never overlaps the panel). dvh keeps
           the cap honest under mobile browser chrome. */
        width: min(100%, calc((100vh - 12px) * 16 / 9));
        width: min(100%, calc((100dvh - 12px) * 16 / 9));
        aspect-ratio: 16 / 9;
        height: auto;
        cursor: pointer;
      }
      /* Metrics popover (owner request): the stats/chart ride ON the canvas
         as a dismissible overlay — flat tonal card + hairline, no shadow
         (doctrine) — so the world column is canvas-only and the page never
         scrolls. The toggle chip sits in the canvas's bottom-left corner. */
      #metrics-toggle {
        position: absolute;
        left: 14px;
        bottom: 14px;
        z-index: 3;
        font: inherit;
        font-size: 12px;
        color: var(--text);
        background: #1a212d;
        border: 1px solid var(--panel-border);
        border-radius: 5px;
        padding: 4px 10px;
        cursor: pointer;
      }
      #metrics-toggle[aria-pressed='true'] {
        border-color: var(--accent);
        color: var(--accent);
      }
      .metrics {
        position: absolute;
        left: 14px;
        bottom: 48px;
        z-index: 2;
        width: min(520px, calc(100% - 28px));
        max-height: calc(100% - 62px);
        overflow-y: auto;
        box-sizing: border-box;
        padding: 6px 12px 8px;
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        border-radius: 6px;
      }
      .metrics[hidden] {
        display: none;
      }
      #wait-chart {
        display: block;
        width: 100%;
        height: 110px;
        margin-top: 4px;
        background: #0b0e14;
        border: 1px solid var(--panel-border);
        border-radius: 4px;
        cursor: default;
      }
      .headline-stats {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 22px;
        margin: 0;
      }
      .premise {
        margin: 0 0 4px;
        font-size: 12px;
        line-height: 1.2;
        color: var(--text-dim);
      }
      .stat {
        white-space: nowrap;
      }
      .stat-label {
        font-size: 12px;
        color: var(--text-dim);
        margin-right: 6px;
      }
      .stat-value {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 14px;
        color: var(--accent);
      }
      .overlay-toggle {
        margin: 4px 0 0;
        font-size: 12px;
      }
      .overlay-body {
        max-height: 340px;
        overflow-y: auto;
      }
      .overlay-body h3 {
        font-size: 12px;
        color: var(--text-dim);
        margin: 10px 0 4px;
      }
      .overlay-summary,
      .overlay-params {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1px 18px;
        margin: 0;
        font-size: 12px;
      }
      .overlay-summary dt,
      .overlay-params dt {
        color: var(--text-dim);
      }
      .overlay-summary dd,
      .overlay-params dd {
        margin: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .arm-bars {
        display: grid;
        gap: 3px;
      }
      .arm-bar-row {
        display: grid;
        grid-template-columns: 52px 1fr 72px;
        align-items: center;
        gap: 8px;
        font-size: 12px;
      }
      .arm-bar-name {
        color: var(--text-dim);
      }
      .arm-bar-track {
        height: 10px;
        background: #1a212d;
        border: 1px solid var(--panel-border);
        border-radius: 3px;
        overflow: hidden;
      }
      .arm-bar-fill {
        height: 100%;
        background: var(--accent);
        border-radius: 2px;
      }
      .arm-bar-value {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        text-align: right;
      }
      .overlay-arm-table {
        border-collapse: collapse;
        font-size: 12px;
        width: 100%;
      }
      .overlay-arm-table th,
      .overlay-arm-table td {
        text-align: left;
        padding: 2px 10px 2px 0;
        border-bottom: 1px solid var(--panel-border);
        font-weight: normal;
      }
      .overlay-arm-table thead th {
        color: var(--text-dim);
      }
      .overlay-arm-table td {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .metrics .hint {
        margin: 10px 0 0;
      }
      #panel {
        flex: 0 0 340px;
        width: 340px;
        max-width: 340px;
        box-sizing: border-box;
        max-height: 100vh;
        overflow-y: auto;
        /* The panel is an independent scrolling region: its internal layout
           (and its scrollable overflow) must never contribute to the page's
           scroll geometry — without this, Chrome's flex line sizing leaks
           the panel's content height into the document and breaks the
           1280×720 no-scroll contract (found in the layout pass). */
        contain: layout;
        padding: 12px 14px 24px;
        background: var(--panel-bg);
        border-left: 1px solid var(--panel-border);
      }
      /* Mobile deck (adapt pass) — desktop default: no bar, and the wrapper
         contributes no box of its own, so the three mounts flow inside #panel
         exactly as they did before the wrapper existed. */
      .deck-bar {
        display: none;
      }
      #deck-body {
        display: contents;
      }
      #panel fieldset {
        border: 1px solid var(--panel-border);
        border-radius: 6px;
        margin: 0 0 12px;
        padding: 8px 10px 10px;
      }
      #panel legend {
        font-size: 12px;
        color: var(--text-dim);
        padding: 0 4px;
      }
      #panel label {
        font-size: 12px;
        display: inline-block;
      }
      #panel output {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: var(--accent);
      }
      .inline-field {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 6px 0;
      }
      .inline-field label {
        min-width: 76px;
      }
      .pause-button {
        display: block;
        width: 100%;
        margin: 6px 0;
        padding: 6px 10px;
        font: inherit;
        color: var(--text);
        background: #1a212d;
        border: 1px solid var(--panel-border);
        border-radius: 5px;
        cursor: pointer;
      }
      .pause-button[aria-pressed='true'] {
        border-color: var(--accent);
        color: var(--accent);
      }
      select,
      input[type='range'] {
        width: 100%;
        accent-color: var(--accent);
      }
      .slider-field {
        margin: 6px 0;
      }
      .slider-field label {
        display: flex;
        justify-content: space-between;
        width: 100%;
      }
      .mix-group h4 {
        font-size: 13px;
        margin: 8px 0 4px;
      }
      /* Arms collapse to their headers (details/summary): the four-arm wall
         yields to the task loop above; canvas/arm selection expands. The
         state chevron is a drawn triangle — instant flip, no motion. */
      .arm-summary {
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        list-style: none;
        padding: 2px 0;
        user-select: none;
      }
      .arm-summary::-webkit-details-marker {
        display: none;
      }
      .arm-summary::before {
        content: '';
        flex: 0 0 auto;
        width: 0;
        height: 0;
        border-left: 4px solid var(--text-dim);
        border-top: 3px solid transparent;
        border-bottom: 3px solid transparent;
      }
      .arm-section[open] > .arm-summary::before {
        border-left: 3px solid transparent;
        border-right: 3px solid transparent;
        border-top: 4px solid var(--text-dim);
        border-bottom: none;
      }
      .arm-summary h3 {
        font-size: 13px;
        margin: 0;
      }
      .arm-section {
        border: 1px dashed transparent;
        border-radius: 6px;
        padding: 2px 6px;
        /* Between arms (8px) deliberately exceeds the within-arm rhythm
           (6px) so four arms read as four groups, not one slider wall. */
        margin: 8px -6px;
      }
      .arm-section.selected {
        border-color: var(--accent);
      }
      .lane-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 4px 10px;
        margin: 4px 0;
        padding: 2px 4px;
        border-radius: 4px;
      }
      .lane-row.selected {
        background: #16202e;
        outline: 1px solid var(--accent);
      }
      .lane-name {
        font-size: 12px;
        min-width: 64px;
        color: var(--text-dim);
      }
      .lane-turn-label {
        font-size: 12px;
      }
      .cycle-line {
        margin: 8px 0 2px;
        font-size: 13px;
      }
      .hint {
        font-size: 12px;
        color: var(--text-dim);
        margin: 6px 0;
      }
      .issues-group {
        margin: 0 0 12px;
      }
      .issues-group h3 {
        display: none;
        color: var(--error);
        font-size: 13px;
        margin: 8px 0 4px;
      }
      .issues-group.has-issues h3 {
        display: block;
      }
      .issues-list {
        margin: 0;
        padding-left: 18px;
        color: var(--error);
        font-size: 12px;
      }
      .issues-list:empty {
        display: none;
      }
      /* O2 optimizer panel: run/cancel, throttled progress status (polite
         live region), scrollable ranked results with one-click Apply. */
      .optimizer-buttons {
        display: flex;
        gap: 8px;
        margin: 6px 0;
      }
      .optimizer-run-button,
      .optimizer-cancel-button,
      .optimizer-apply-button {
        font: inherit;
        color: var(--text);
        background: #1a212d;
        border: 1px solid var(--panel-border);
        border-radius: 5px;
        cursor: pointer;
      }
      .optimizer-run-button,
      .optimizer-cancel-button {
        flex: 1 1 auto;
        padding: 6px 10px;
      }
      .optimizer-cancel-button {
        flex: 0 0 auto;
      }
      .optimizer-run-button:disabled,
      .optimizer-cancel-button:disabled,
      .optimizer-apply-button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .optimizer-status {
        margin: 4px 0 6px;
        font-size: 12px;
        min-height: 16px;
      }
      .optimizer-results {
        border: 1px solid var(--panel-border);
        border-radius: 4px;
        padding: 4px 0;
        max-height: 300px;
        overflow-y: auto;
      }
      .optimizer-results-summary {
        margin: 2px 8px 6px;
        font-size: 12px;
        color: var(--text-dim);
      }
      /* Delight: the sweep verdict — one deadpan sentence judging the
         operator's tuning; numbers stay mono accent (the doctrine's only
         voice for data), structure comes from the hairline below. */
      .optimizer-verdict {
        margin: 4px 8px 2px;
        padding: 2px 0 8px;
        font-size: 12px;
        border-bottom: 1px solid var(--panel-border);
      }
      .optimizer-verdict strong {
        font-weight: 600;
      }
      .optimizer-verdict-number {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: var(--accent);
      }
      .optimizer-row {
        display: grid;
        /* Fixed tracks so every row's columns align: rank | greens | delay |
           delta (or the Current badge) | Apply. */
        grid-template-columns: 18px minmax(0, 1fr) 52px 52px auto;
        align-items: center;
        column-gap: 3px;
        padding: 3px 6px;
        font-size: 12px;
        border-top: 1px solid var(--panel-border);
      }
      .optimizer-row.best {
        background: #16233a;
      }
      .optimizer-row.current {
        outline: 1px dashed var(--accent);
        outline-offset: -1px;
      }
      .optimizer-rank {
        color: var(--text-dim);
        text-align: right;
      }
      .optimizer-greens {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        white-space: nowrap;
      }
      .optimizer-badge {
        font-size: 10px;
        line-height: 1;
        padding: 2px 4px;
        border: 1px solid var(--panel-border);
        border-radius: 3px;
        color: var(--text-dim);
        white-space: nowrap;
        justify-self: end;
      }
      .optimizer-row.current .badge-current {
        border-color: var(--accent);
        color: var(--accent);
      }
      .optimizer-metrics,
      .optimizer-delta {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        white-space: nowrap;
        text-align: right;
        justify-self: end;
      }
      .optimizer-delta {
        color: var(--text-dim);
      }
      .optimizer-apply-button {
        font-size: 12px;
        padding: 2px 10px;
      }
      .optimizer-apply-issue {
        margin: 6px 0 0;
        color: var(--error);
        font-size: 12px;
      }
      .optimizer-apply-issue[hidden] {
        display: none;
      }
      /* Harden: boot/loop failure notice + no-JavaScript message — the same
         instrument voice as the issues list (panel surface, hairline, Error
         red, no shadows/transitions). Errors name the problem and the
         recovery. */
      .boot-error {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 14px;
        box-sizing: border-box;
        padding: 10px 14px;
        font-size: 13px;
        background: var(--panel-bg);
        border-bottom: 1px solid var(--panel-border);
      }
      .boot-error strong {
        color: var(--error);
        font-weight: 600;
      }
      .boot-error-detail {
        flex: 1 1 240px;
        min-width: 0;
        font-size: 12px;
        color: var(--text);
        overflow-wrap: anywhere;
      }
      .boot-error button {
        font: inherit;
        font-size: 12px;
        color: var(--text);
        background: #1a212d;
        border: 1px solid var(--panel-border);
        border-radius: 5px;
        padding: 4px 10px;
        cursor: pointer;
      }
      /* Browser surfaces the chrome didn't draw (polish pass): scrollbars
         and text selection come from the platform by default — theme them
         from the ladder like every other surface. */
      #panel,
      .metrics,
      .optimizer-results,
      .overlay-body,
      #deck-body {
        scrollbar-width: thin;
        scrollbar-color: #232a36 transparent;
      }
      #panel::-webkit-scrollbar,
      .metrics::-webkit-scrollbar,
      .optimizer-results::-webkit-scrollbar,
      .overlay-body::-webkit-scrollbar,
      #deck-body::-webkit-scrollbar {
        width: 8px;
      }
      #panel::-webkit-scrollbar-thumb,
      .metrics::-webkit-scrollbar-thumb,
      .optimizer-results::-webkit-scrollbar-thumb,
      .overlay-body::-webkit-scrollbar-thumb,
      #deck-body::-webkit-scrollbar-thumb {
        background: #232a36;
        border-radius: 4px;
      }
      #panel::-webkit-scrollbar-thumb:hover,
      .metrics::-webkit-scrollbar-thumb:hover,
      .optimizer-results::-webkit-scrollbar-thumb:hover,
      .overlay-body::-webkit-scrollbar-thumb:hover,
      #deck-body::-webkit-scrollbar-thumb:hover {
        background: #384359;
      }
      #panel::-webkit-scrollbar-track,
      .metrics::-webkit-scrollbar-track,
      .optimizer-results::-webkit-scrollbar-track,
      .overlay-body::-webkit-scrollbar-track,
      #deck-body::-webkit-scrollbar-track {
        background: transparent;
      }
      ::selection {
        background: rgba(111, 183, 255, 0.28);
      }
      /* Visible focus for every interactive control (accessibility stance). */
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      /* ===== Mobile adaptation (adapt pass) ===== */
      /* Touch feedback: a pressed control steps one rung up the tonal ladder
         — instant color state, per doctrine (never motion). */
      .pause-button:active,
      #metrics-toggle:active,
      .optimizer-run-button:active,
      .optimizer-cancel-button:active,
      .optimizer-apply-button:active,
      #deck-toggle:active,
      .arm-summary:active {
        background: #232a36;
      }
      /* Coarse pointers (touch): 44px minimum targets everywhere, 16px
         control text (a smaller computed font-size makes Mobile Safari zoom
         the whole page when a control takes focus), and no double-tap-zoom
         delay. */
      @media (pointer: coarse) {
        html {
          -webkit-tap-highlight-color: transparent;
        }
        body {
          touch-action: manipulation;
        }
        select,
        input {
          font-size: 16px;
        }
        .pause-button,
        .optimizer-run-button,
        .optimizer-cancel-button,
        .optimizer-apply-button,
        #metrics-toggle,
        #deck-toggle,
        select,
        .slider-field,
        .lane-row,
        .arm-summary,
        .inline-field {
          min-height: 44px;
        }
        input[type='range'] {
          height: 32px;
        }
        input[type='checkbox'] {
          width: 20px;
          height: 20px;
        }
        /* The label is part of the checkbox's hit area (htmlFor). */
        .lane-turn-label {
          padding: 10px 8px 10px 4px;
        }
      }
      /* Portrait phones and tablets (< 980px): the docked-deck composition.
         One 100dvh column — world on top, metrics in flow beneath it (never
         a popover over a six-inch canvas), controls docked at the bottom
         behind a persistent bar. World and headline stay visible while the
         deck is open, so the premise (tune a green, watch delay answer)
         survives the small screen. The page itself never scrolls. */
      @media (max-width: 980px) and (orientation: portrait) {
        .stage {
          flex-direction: column;
          flex-wrap: nowrap;
          height: 100vh;
          height: 100dvh;
          min-height: 0;
          overflow-y: auto;
        }
        .world-column {
          flex: 1 1 auto;
          min-height: 0;
        }
        /* The wrap is a flex ROW on desktop (canvas centered, popover
           absolute). In the column composition it becomes a column itself so
           the canvas stacks over the in-flow metrics card — the card is
           nested here, not in .world-column, and a row would park it beside
           the canvas. */
        .canvas-wrap {
          flex: 1 1 auto;
          min-height: 0;
          display: flex;
          flex-direction: column;
          align-items: stretch;
          padding: 6px 6px 0;
        }
        #world {
          width: 100%;
          flex: none;
        }
        /* The card is in flow under the canvas, so its toggle chip flows
           too — a small pill on the seam line, not a floating corner. */
        #metrics-toggle {
          position: static;
          align-self: flex-start;
          margin: 6px;
        }
        .metrics {
          position: static;
          width: auto;
          max-height: none;
          flex: 1 1 auto;
          min-height: 150px;
          margin: 0 6px 6px;
          overscroll-behavior: contain;
          /* The card fills the leftover viewport, and the chart — the
             premise's "answer" — absorbs the breathing room (capped so the
             card never becomes all chart). */
          display: flex;
          flex-direction: column;
        }
        #wait-chart {
          flex: 1 1 120px;
          height: auto;
          min-height: 110px;
          max-height: 240px;
        }
        /* The Window detail stat is one long nowrap line — at card width it
           would overflow the card edge, so stats may wrap their words. */
        .headline-stats .stat {
          white-space: normal;
        }
        #panel {
          flex: none;
          width: auto;
          max-width: none;
          max-height: none;
          display: flex;
          flex-direction: column;
          min-height: 0;
          padding: 0;
          padding-bottom: env(safe-area-inset-bottom);
          border-left: none;
          border-top: 1px solid var(--panel-border);
        }
        .deck-bar {
          display: block;
        }
        #deck-toggle {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 8px;
          width: 100%;
          box-sizing: border-box;
          min-height: 48px;
          padding: 8px 14px;
          font: inherit;
          font-size: 13px;
          font-weight: 600;
          color: var(--text);
          background: var(--panel-bg);
          border: 0;
          cursor: pointer;
        }
        /* The deck's state chevron — the arm-summary triangle, flipped. */
        #deck-toggle::after {
          content: '';
          flex: 0 0 auto;
          width: 0;
          height: 0;
          border-left: 5px solid var(--text-dim);
          border-top: 4px solid transparent;
          border-bottom: 4px solid transparent;
        }
        #deck-toggle[aria-expanded='true']::after {
          border-left: 4px solid transparent;
          border-right: 4px solid transparent;
          border-top: 5px solid var(--text-dim);
          border-bottom: none;
        }
        #deck-body {
          display: block;
          /* The open deck leaves the canvas (56.25vw tall), the metrics chip
             row, a usable card minimum, and the bar itself visible above it;
             floored at 200px so short phones still get a usable deck (the
             stage scrolls rather than clipping). */
          max-height: max(200px, min(60vh, calc(100vh - 56.25vw - 300px)));
          max-height: max(200px, min(60dvh, calc(100dvh - 56.25vw - 300px)));
          overflow-y: auto;
          overscroll-behavior: contain;
          padding: 10px 14px 18px;
          border-top: 1px solid var(--panel-border);
        }
        #deck-body[hidden] {
          display: none;
        }
      }
      /* Landscape phones (< 980px): too short to dock anything — the world
         caps at viewport height, metrics and controls flow beneath it, and
         the page scrolls (the old narrow-window wrap behavior, made
         intentional and touch-sized). */
      @media (max-width: 980px) and (orientation: landscape) {
        .stage {
          flex-direction: column;
          flex-wrap: nowrap;
          min-height: 100vh;
          min-height: 100dvh;
        }
        .world-column {
          flex: none;
        }
        /* Column stack (see portrait): canvas over in-flow card — the card
           lives inside this wrap and must not sit beside the canvas. */
        .canvas-wrap {
          flex: none;
          min-height: 0;
          display: flex;
          flex-direction: column;
          align-items: stretch;
        }
        #world {
          flex: none;
          align-self: center;
        }
        #metrics-toggle {
          position: static;
          align-self: flex-start;
          margin: 6px;
        }
        .metrics {
          position: static;
          width: auto;
          max-height: none;
          margin: 0 6px;
        }
        .headline-stats .stat {
          white-space: normal;
        }
        #panel {
          width: auto;
          max-width: none;
          max-height: none;
          border-left: none;
          border-top: 1px solid var(--panel-border);
        }
      }
    </style>
  </head>
  <body>
    <noscript>
      <div class="boot-error" role="alert">
        <strong>JavaScript is required.</strong>
        <span class="boot-error-detail">
          This simulator runs entirely in your browser — the simulation, the renderer, and the
          charts are all computed locally, with no backend. Enable JavaScript and reload the page.
        </span>
      </div>
    </noscript>
    <h1 class="visually-hidden">Traffic Intersection Flow Simulator</h1>
    <main class="stage">
      <div class="world-column">
        <div class="canvas-wrap">
          <canvas
            id="world"
            role="img"
            aria-label="Traffic intersection simulation (canvas). Use the control panel to edit the intersection; click an arm to select it."
          ></canvas>
          <!-- Metrics popover (owner request): the stats/chart ride ON the
             canvas as a dismissible overlay, so the world column is
             canvas-only and nothing ever page-scrolls. The toggle lives in
             the canvas's bottom-left corner (the HUD owns the top-left). -->
          <button id="metrics-toggle" type="button" aria-pressed="true">Metrics</button>
          <section class="metrics" id="metrics-popover" aria-label="Live metrics">
            <h2 class="visually-hidden">Live metrics</h2>
            <!-- The premise line: the one taught interaction — the aha action
               (tweak a green, watch delay answer). Static by design: a caption
               that is always true, not a tooltip to dismiss. -->
            <p class="premise">Tune a green phase in the panel — the delay line answers.</p>
            <div id="headline-stats"></div>
            <canvas
              id="wait-chart"
              role="img"
              aria-label="Rolling average wait chart over the last three simulated minutes. Current values: see the headline statistics above."
            ></canvas>
            <div id="engineering-overlay"></div>
          </section>
        </div>
      </div>
      <aside id="panel" aria-label="Simulation controls">
        <!-- Mobile deck (adapt pass): below 980px in portrait the panel docks
           to the bottom of the viewport as an expandable deck — a persistent
           "Controls" bar plus a scrollable body — so the world and metrics
           stay visible while tuning. Desktop flattens the wrapper (the bar
           hides, the body becomes in-flow children of #panel exactly as
           before). Task order inside is unchanged: transport + greens, then
           the optimizer, then the deep config. -->
        <div class="deck-bar">
          <button id="deck-toggle" type="button" aria-expanded="false" aria-controls="deck-body">
            Controls
          </button>
        </div>
        <div id="deck-body">
          <div id="controls-top"></div>
          <div id="optimizer"></div>
          <div id="controls-rest"></div>
        </div>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
