<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Traffic Intersection Flow Simulator</title>
    <style>
      :root {
        color-scheme: dark;
        --panel-bg: #10141c;
        --panel-border: #232a36;
        --text: #d7dde8;
        --text-dim: #8b95a6;
        --accent: #6fb7ff;
        --error: #ff7a7a;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #090b10;
      }
      body {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: var(--text);
      }
      /* Screen-reader-only text (D1 a11y: page h1 + section h2 without
         visual weight). */
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        border: 0;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        overflow: hidden;
        white-space: nowrap;
      }
      /* Stage: canvas world + control panel side by side at >= 1280x720; the
         panel wraps below on narrow windows (not a target viewport). */
      .stage {
        display: flex;
        flex-wrap: wrap;
        align-items: stretch;
        min-height: 100vh;
      }
      .world-column {
        flex: 1 1 640px;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .canvas-wrap {
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
        min-height: 320px;
      }
      #world {
        display: block;
        background: #0b0e14;
        /* 1280x720 logical frame, scaled to the laid-out box (painter sizes
           the backing store to match; never overlaps the panel). */
        width: min(100%, calc((100vh - 16px) * 16 / 9));
        aspect-ratio: 16 / 9;
        height: auto;
        cursor: pointer;
      }
      /* U3 metrics card under the canvas: the chart stays visible next to the
         canvas without taking width from it (the canvas is width-limited at
         1280x720, so a below-canvas card crowds nothing). */
      .metrics {
        margin: 0 8px 8px;
        padding: 8px 12px 10px;
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        border-radius: 6px;
      }
      #wait-chart {
        display: block;
        width: 100%;
        height: 110px;
        margin-top: 6px;
        background: #0b0e14;
        border: 1px solid var(--panel-border);
        border-radius: 4px;
        cursor: default;
      }
      .headline-stats {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 22px;
        margin: 0;
      }
      .stat {
        white-space: nowrap;
      }
      .stat-label {
        font-size: 12px;
        color: var(--text-dim);
        margin-right: 6px;
      }
      .stat-value {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 14px;
        color: var(--accent);
      }
      .overlay-toggle {
        margin: 8px 0 0;
        font-size: 12px;
      }
      .overlay-body h3 {
        font-size: 12px;
        color: var(--text-dim);
        margin: 10px 0 4px;
      }
      .overlay-summary,
      .overlay-params {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1px 18px;
        margin: 0;
        font-size: 12px;
      }
      .overlay-summary dt,
      .overlay-params dt {
        color: var(--text-dim);
      }
      .overlay-summary dd,
      .overlay-params dd {
        margin: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .arm-bars {
        display: grid;
        gap: 3px;
      }
      .arm-bar-row {
        display: grid;
        grid-template-columns: 52px 1fr 72px;
        align-items: center;
        gap: 8px;
        font-size: 12px;
      }
      .arm-bar-name {
        color: var(--text-dim);
      }
      .arm-bar-track {
        height: 10px;
        background: #1a212d;
        border: 1px solid var(--panel-border);
        border-radius: 3px;
        overflow: hidden;
      }
      .arm-bar-fill {
        height: 100%;
        background: var(--accent);
        border-radius: 2px;
      }
      .arm-bar-value {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        text-align: right;
      }
      .overlay-arm-table {
        border-collapse: collapse;
        font-size: 12px;
        width: 100%;
      }
      .overlay-arm-table th,
      .overlay-arm-table td {
        text-align: left;
        padding: 2px 10px 2px 0;
        border-bottom: 1px solid var(--panel-border);
        font-weight: normal;
      }
      .overlay-arm-table thead th {
        color: var(--text-dim);
      }
      .overlay-arm-table td {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .metrics .hint {
        margin: 10px 0 0;
      }
      #panel {
        flex: 0 0 340px;
        width: 340px;
        max-width: 340px;
        box-sizing: border-box;
        max-height: 100vh;
        overflow-y: auto;
        padding: 12px 14px 24px;
        background: var(--panel-bg);
        border-left: 1px solid var(--panel-border);
      }
      #panel h2 {
        font-size: 16px;
        margin: 0 0 10px;
      }
      #panel fieldset {
        border: 1px solid var(--panel-border);
        border-radius: 6px;
        margin: 0 0 12px;
        padding: 8px 10px 10px;
      }
      #panel legend {
        font-size: 12px;
        color: var(--text-dim);
        padding: 0 4px;
      }
      #panel label {
        font-size: 12px;
        display: inline-block;
      }
      #panel output {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: var(--accent);
      }
      .inline-field {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 6px 0;
      }
      .inline-field label {
        min-width: 76px;
      }
      .pause-button {
        display: block;
        width: 100%;
        margin: 6px 0;
        padding: 6px 10px;
        font: inherit;
        color: var(--text);
        background: #1a212d;
        border: 1px solid var(--panel-border);
        border-radius: 5px;
        cursor: pointer;
      }
      .pause-button[aria-pressed='true'] {
        border-color: var(--accent);
        color: var(--accent);
      }
      select,
      input[type='range'] {
        width: 100%;
        accent-color: var(--accent);
      }
      .slider-field {
        margin: 6px 0;
      }
      .slider-field label {
        display: flex;
        justify-content: space-between;
        width: 100%;
      }
      .mix-group h4,
      .arm-section h3 {
        font-size: 13px;
        margin: 8px 0 4px;
      }
      .arm-select-button {
        font: inherit;
        font-size: 13px;
        color: inherit;
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
        text-decoration: underline dotted;
      }
      .arm-section {
        border: 1px dashed transparent;
        border-radius: 6px;
        padding: 2px 6px;
        margin: 4px -6px;
      }
      .arm-section.selected {
        border-color: var(--accent);
      }
      .lane-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 4px 10px;
        margin: 4px 0;
        padding: 2px 4px;
        border-radius: 4px;
      }
      .lane-row.selected {
        background: #16202e;
        outline: 1px solid var(--accent);
      }
      .lane-name {
        font-size: 12px;
        min-width: 110px;
        color: var(--text-dim);
      }
      .lane-turn-label {
        font-size: 12px;
      }
      .cycle-line {
        margin: 8px 0 2px;
        font-size: 13px;
      }
      .hint {
        font-size: 12px;
        color: var(--text-dim);
        margin: 6px 0;
      }
      .issues-group h3 {
        display: none;
        color: var(--error);
        font-size: 13px;
        margin: 8px 0 4px;
      }
      .issues-group.has-issues h3 {
        display: block;
      }
      .issues-list {
        margin: 0;
        padding-left: 18px;
        color: var(--error);
        font-size: 12px;
      }
      .issues-list:empty {
        display: none;
      }
      /* O2 optimizer panel: run/cancel, throttled progress status (polite
         live region), scrollable ranked results with one-click Apply. */
      .optimizer-buttons {
        display: flex;
        gap: 8px;
        margin: 6px 0;
      }
      .optimizer-run-button,
      .optimizer-cancel-button,
      .optimizer-apply-button {
        font: inherit;
        color: var(--text);
        background: #1a212d;
        border: 1px solid var(--panel-border);
        border-radius: 5px;
        cursor: pointer;
      }
      .optimizer-run-button,
      .optimizer-cancel-button {
        flex: 1 1 auto;
        padding: 6px 10px;
      }
      .optimizer-cancel-button {
        flex: 0 0 auto;
      }
      .optimizer-run-button:disabled,
      .optimizer-cancel-button:disabled,
      .optimizer-apply-button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .optimizer-status {
        margin: 4px 0 6px;
        font-size: 12px;
        min-height: 16px;
      }
      .optimizer-results {
        border: 1px solid var(--panel-border);
        border-radius: 4px;
        padding: 4px 0;
        max-height: 300px;
        overflow-y: auto;
      }
      .optimizer-results-summary {
        margin: 2px 8px 6px;
        font-size: 12px;
        color: var(--text-dim);
      }
      .optimizer-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 4px 10px;
        padding: 3px 8px;
        font-size: 12px;
        border-top: 1px solid var(--panel-border);
      }
      .optimizer-row.best {
        background: #16233a;
      }
      .optimizer-row.current {
        outline: 1px dashed var(--accent);
        outline-offset: -1px;
      }
      .optimizer-row-head {
        display: flex;
        align-items: center;
        gap: 6px;
        flex: 1 1 150px;
        min-width: 0;
      }
      .optimizer-rank {
        color: var(--text-dim);
      }
      .optimizer-greens {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        white-space: nowrap;
      }
      .optimizer-badge {
        font-size: 10px;
        line-height: 1;
        padding: 2px 4px;
        border: 1px solid var(--panel-border);
        border-radius: 3px;
        color: var(--text-dim);
        white-space: nowrap;
      }
      .optimizer-row.best .badge-best {
        border-color: var(--accent);
        color: var(--accent);
      }
      .optimizer-row.current .badge-current {
        border-color: var(--accent);
        color: var(--accent);
      }
      .optimizer-metrics,
      .optimizer-delta {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        white-space: nowrap;
      }
      .optimizer-delta {
        color: var(--text-dim);
      }
      .optimizer-apply-button {
        font-size: 12px;
        padding: 2px 10px;
      }
      .optimizer-apply-issue {
        margin: 6px 0 0;
        color: var(--error);
        font-size: 12px;
      }
      .optimizer-apply-issue[hidden] {
        display: none;
      }
      /* Visible focus for every interactive control (accessibility stance). */
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <h1 class="visually-hidden">Traffic Intersection Flow Simulator</h1>
    <main class="stage">
      <div class="world-column">
        <div class="canvas-wrap">
          <canvas
            id="world"
            role="img"
            aria-label="Traffic intersection simulation (canvas). Use the control panel to edit the intersection; click an arm to select it."
          ></canvas>
        </div>
        <section class="metrics" aria-label="Live metrics">
          <h2 class="visually-hidden">Live metrics</h2>
          <div id="headline-stats"></div>
          <canvas
            id="wait-chart"
            role="img"
            aria-label="Rolling average wait chart over the last three simulated minutes. Current values: see the headline statistics above."
          ></canvas>
          <div id="engineering-overlay"></div>
        </section>
      </div>
      <aside id="panel" aria-label="Simulation controls">
        <!-- U2 control panel (renders #controls) + O2 optimizer (renders
             #optimizer): sibling containers so neither wipes the other. -->
        <div id="controls"></div>
        <div id="optimizer"></div>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
